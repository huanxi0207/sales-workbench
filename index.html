<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="One77-饰品">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>💎</text></svg>">
  <title>One77-饰品</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f2f5f9; color: #1e2b3c; padding-bottom: 70px; }
    .header { background: #0a2540; color: white; padding: 16px 20px; font-size: 20px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
    .tab-bar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e0e6ed; z-index: 10; }
    .tab { flex: 1; text-align: center; padding: 12px 8px; font-size: 14px; color: #5f6b7a; transition: 0.2s; cursor: pointer; }
    .tab.active { color: #0a2540; font-weight: 600; border-bottom: 3px solid #0a2540; background: #f8fafd; }
    .page { display: none; padding: 16px; }
    .page.active { display: block; }
    .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .card h3 { margin-bottom: 12px; font-size: 18px; color: #0a2540; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .row input, .row select { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #dce1e8; border-radius: 10px; font-size: 15px; background: #f9fbfd; }
    .row input[type="file"] { flex: 0 1 auto; padding: 5px; }
    button { background: #0a2540; color: white; border: none; border-radius: 10px; padding: 10px 16px; font-size: 15px; cursor: pointer; transition: 0.2s; }
    button.secondary { background: #e7ecf2; color: #1e2b3c; }
    button.danger { background: #d1453b; }
    .product-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 0 0 8px 0; flex-wrap: wrap; gap: 8px; }
    .product-info strong { font-size: 17px; }
    .product-info div { font-size: 14px; color: #5f6b7a; margin-top: 2px; }
    .stock-badge { background: #e6f0fa; color: #0a2540; padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; }
    .sale-record { padding: 10px 0; border-bottom: 1px solid #edf2f8; font-size: 14px; }
    .stat-num { font-size: 32px; font-weight: bold; color: #0a2540; }
    .stat-label { font-size: 14px; color: #5f6b7a; }
    .grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 12px; }
    .tip { font-size: 13px; color: #8a9ca5; margin-top: 6px; }
  </style>
</head>
<body>
  <!-- 修改标题 -->
  <div class="header">💎 One77-饰品</div>

  <!-- 首页为销售页面 -->
  <div id="tab-sales" class="page active">
    <div class="card">
      <h3>🧾 销售记账</h3>
      <div class="row">
        <select id="saleProduct"><option value="">-- 选择货品 --</option></select>
        <input type="number" id="saleQty" placeholder="数量" min="1" value="1">
      </div>
      <div id="salePreview" style="margin:8px 0; font-size:14px; color:#5f6b7a;"></div>
      <button onclick="recordSale()">确认销售</button>
    </div>
    <div class="card">
      <h3>📋 最近销售记录</h3>
      <div id="saleList"></div>
    </div>
  </div>

  <!-- 货品页面 -->
  <div id="tab-products" class="page">
    <div class="card">
      <h3>➕ 添加货品</h3>
      <div class="row">
        <input type="text" id="prodName" placeholder="货品名称" style="flex:2;">
        <input type="number" id="prodPurchase" placeholder="进价" step="0.01" style="flex:1;">
        <input type="number" id="prodSelling" placeholder="售价" step="0.01" style="flex:1;">
        <input type="number" id="prodStock" placeholder="初始库存" step="1" style="flex:1;">
      </div>
      <div class="row" style="margin-bottom: 12px;">
        <input type="text" id="prodImageUrl" placeholder="图片链接 (以 http 开头)" style="flex:2;">
        <input type="file" id="prodImageFile" accept="image/*" style="flex:1;">
      </div>
      <div class="tip">💡 可以粘贴网络图片链接，或点击“浏览”从相册选择图片（建议图片小于 100KB）</div>
      <button onclick="addProduct()">添加货品</button>
    </div>

    <div class="card" style="padding: 10px 16px;">
      <input type="text" id="searchInput" placeholder="🔍 输入关键字搜索货品名称" style="width:100%; padding: 10px; border:none; outline:none; background:transparent; font-size: 15px;">
    </div>
    <div id="productList"></div>
  </div>

  <!-- 统计页面 -->
  <div id="tab-stats" class="page">
    
    <!-- 1. 今日小结（从销售页挪过来，放在最上方） -->
    <div class="card" style="background: #eef4f8;">
      <h3>📅 今日小结</h3>
      <div class="grid-3">
        <div><div class="stat-label">今日销售</div><div class="stat-num" style="font-size: 24px;" id="todayRevenue">¥0</div></div>
        <div><div class="stat-label">今日成本</div><div class="stat-num" style="font-size: 24px;" id="todayCost">¥0</div></div>
        <div><div class="stat-label">今日利润</div><div class="stat-num" style="font-size: 24px;" id="todayProfit">¥0</div></div>
      </div>
    </div>

    <!-- 2. 历史每日小结列表 -->
    <div class="card">
      <h3>📆 历史每日小结</h3>
      <div id="dailySummaryList" style="max-height: 250px; overflow-y: auto;"></div>
    </div>

    <!-- 3. 总统计概览 -->
    <div class="card">
      <h3>📈 统计概览</h3>
      <div class="grid-3">
        <div><div class="stat-num" id="totalRevenue">0</div><div class="stat-label">总销售额</div></div>
        <div><div class="stat-num" id="totalCost">0</div><div class="stat-label">总成本</div></div>
        <div><div class="stat-num" id="totalProfit">0</div><div class="stat-label">总利润</div></div>
      </div>
      <button class="secondary" onclick="exportData()">📤 导出备份</button>
      <button class="secondary" onclick="importDataPrompt()" style="margin-left:8px;">📥 导入备份</button>
      <button class="danger" onclick="clearAllData()" style="margin-left:8px;">🗑 清空数据</button>
    </div>
    
    <div class="card">
      <h3>📦 按货品统计</h3>
      <div id="productStats"></div>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab" data-tab="products" onclick="switchTab('products')">📦 货品</div>
    <div class="tab active" data-tab="sales" onclick="switchTab('sales')">🧾 销售</div>
    <div class="tab" data-tab="stats" onclick="switchTab('stats')">📊 统计</div>
  </div>

  <script>
    const STORAGE_KEY = 'sales_workbench_data';
    // 新增：用于保存每日小结的独立 Key
    const DAILY_SUMMARY_KEY = 'daily_summaries_workbench';

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try { return JSON.parse(raw); } catch(e) { return { products: [], sales: [] }; }
      }
      return { products: [], sales: [] };
    }
    function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    let appData = loadData();

    function renderAll() {
      renderProducts();
      renderSalesForm();
      renderSalesList();
      renderStats(); // 这里会一并处理每日小结的更新和渲染
    }

    function switchTab(tab) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-'+tab).classList.add('active');
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');

      if (tab === 'sales') renderSalesForm();
      if (tab === 'stats') renderStats();
    }

    document.getElementById('searchInput').addEventListener('input', renderProducts);

    // 货品管理
    function addProduct() {
      const name = document.getElementById('prodName').value.trim();
      const purchase = parseFloat(document.getElementById('prodPurchase').value);
      const selling = parseFloat(document.getElementById('prodSelling').value);
      const stock = parseInt(document.getElementById('prodStock').value) || 0;
      if (!name || isNaN(purchase) || isNaN(selling) || stock < 0) return alert('请填写完整信息');

      const fileInput = document.getElementById('prodImageFile');
      const file = fileInput.files[0];
      let manualUrl = document.getElementById('prodImageUrl').value.trim() || null;

      const finishAdd = (imgUrl) => {
        const newProduct = {
          id: Date.now().toString(),
          name, purchasePrice: purchase, sellingPrice: selling, stock,
          imageUrl: imgUrl
        };
        appData.products.push(newProduct);
        saveData(appData);
        document.getElementById('prodName').value = '';
        document.getElementById('prodPurchase').value = '';
        document.getElementById('prodSelling').value = '';
        document.getElementById('prodStock').value = '';
        document.getElementById('prodImageUrl').value = '';
        fileInput.value = ''; 
        renderAll(); 
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) { finishAdd(e.target.result); };
        reader.readAsDataURL(file);
      } else {
        finishAdd(manualUrl);
      }
    }

    function deleteProduct(id) {
      if (!confirm('确定删除该货品？销售记录会保留但不再关联。')) return;
      appData.products = appData.products.filter(p => p.id !== id);
      saveData(appData);
      renderAll();
    }

    function addStock(id) {
      const qty = prompt('入库数量：', '1');
      if (!qty || isNaN(qty) || parseInt(qty) <= 0) return;
      const product = appData.products.find(p => p.id === id);
      if (product) {
        product.stock += parseInt(qty);
        saveData(appData);
        renderAll();
      }
    }

    function renderProducts() {
      const container = document.getElementById('productList');
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      
      let filteredProducts = appData.products;
      if (keyword) {
        filteredProducts = filteredProducts.filter(p => p.name.toLowerCase().includes(keyword));
      }

      if (!filteredProducts.length) {
        container.innerHTML = `<div class="card" style="text-align:center;color:#5f6b7a;padding:20px;">${keyword ? '未找到匹配 "' + keyword + '" 的货品' : '暂无货品，请添加'}</div>`;
        return;
      }
      
      container.innerHTML = filteredProducts.map(p => `
        <div class="card">
          <div style="display:flex; align-items:flex-start; gap:12px;">
            <img src="${p.imageUrl || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22%3E%3Crect fill=%22%23f0f2f5%22 width=%2260%22 height=%2260%22/%3E%3Ctext fill=%22%23999999%22 font-size=%2230%22 x=%2218%22 y=%2240%22%3E📦%3C/text%3E%3C/svg%3E'}" alt="商品图" style="width:70px; height:70px; object-fit:cover; border-radius:12px; border:1px solid #eef2f8; flex-shrink:0;">
            <div style="flex:1;">
              <div class="product-item" style="border-bottom:none;">
                <div class="product-info">
                  <strong>${p.name}</strong>
                  <div>进价 ¥${p.purchasePrice.toFixed(2)} | 售价 ¥${p.sellingPrice.toFixed(2)}</div>
                </div>
                <span class="stock-badge">库存 ${p.stock}</span>
              </div>
              <div style="display:flex; gap:8px; margin-top:8px;">
                <button class="secondary" style="padding:6px 12px; font-size:13px;" onclick="addStock('${p.id}')">📥 入库</button>
                <button class="danger" style="padding:6px 12px; font-size:13px;" onclick="deleteProduct('${p.id}')">🗑 删除</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 销售记账
    function renderSalesForm() {
      const select = document.getElementById('saleProduct');
      select.innerHTML = '<option value="">-- 选择货品 --</option>' + 
        appData.products.map(p => `<option value="${p.id}">${p.name} (库存${p.stock})</option>`).join('');
      document.getElementById('saleQty').value = 1;
      document.getElementById('salePreview').innerText = '';
    }

    document.getElementById('saleProduct').addEventListener('change', updateSalePreview);
    document.getElementById('saleQty').addEventListener('input', updateSalePreview);
    function updateSalePreview() {
      const prodId = document.getElementById('saleProduct').value;
      const qty = parseInt(document.getElementById('saleQty').value) || 1;
      const product = appData.products.find(p => p.id === prodId);
      const preview = document.getElementById('salePreview');
      if (product) {
        const totalRevenue = qty * product.sellingPrice;
        const profit = qty * (product.sellingPrice - product.purchasePrice);
        preview.innerText = `销售额: ¥${totalRevenue.toFixed(2)} | 利润: ¥${profit.toFixed(2)} | 当前库存: ${product.stock}`;
      } else {
        preview.innerText = '';
      }
    }

    function recordSale() {
      const prodId = document.getElementById('saleProduct').value;
      const qty = parseInt(document.getElementById('saleQty').value);
      if (!prodId || isNaN(qty) || qty <= 0) return alert('请选择货品并输入有效数量');
      const product = appData.products.find(p => p.id === prodId);
      if (!product) return alert('货品不存在');
      if (product.stock < qty) return alert('库存不足');
      
      const saleRecord = {
        id: Date.now().toString(),
        date: new Date().toISOString(),
        productId: product.id,
        productName: product.name,
        quantity: qty,
        sellingPrice: product.sellingPrice,
        costPrice: product.purchasePrice,
        totalRevenue: qty * product.sellingPrice,
        profit: qty * (product.sellingPrice - product.purchasePrice)
      };
      product.stock -= qty;
      appData.sales.push(saleRecord);
      saveData(appData);
      renderAll();
    }

    function renderSalesList() {
      const container = document.getElementById('saleList');
      const recent = appData.sales.slice().reverse().slice(0, 20);
      if (!recent.length) {
        container.innerHTML = '<div style="color:#5f6b7a; text-align:center;">暂无销售记录</div>';
        return;
      }
      container.innerHTML = recent.map(s => `
        <div class="sale-record">
          <strong>${s.productName}</strong> ×${s.quantity} 
          <span style="float:right;">销售额 ¥${s.totalRevenue.toFixed(2)}</span>
          <div style="color:#5f6b7a;">利润 ¥${s.profit.toFixed(2)} · ${new Date(s.date).toLocaleString('zh-CN')}</div>
        </div>
      `).join('');
    }

    // 统计、日结处理
    function renderStats() {
      // 1. 计算今日数据并展示
      const today = new Date().toISOString().slice(0, 10);
      const todaySales = appData.sales.filter(s => s.date.startsWith(today));
      const todayRevenue = todaySales.reduce((sum, s) => sum + s.totalRevenue, 0);
      const todayCost = todaySales.reduce((sum, s) => sum + (s.costPrice * s.quantity), 0);
      const todayProfit = todaySales.reduce((sum, s) => sum + s.profit, 0);
      
      document.getElementById('todayRevenue').innerText = '¥' + todayRevenue.toFixed(2);
      document.getElementById('todayCost').innerText = '¥' + todayCost.toFixed(2);
      document.getElementById('todayProfit').innerText = '¥' + todayProfit.toFixed(2);

      // 2. 保存并更新每日小结历史列表
      updateDailySummary(today, todayRevenue, todayCost, todayProfit);

      // 3. 渲染历史每日小结列表
      renderDailySummaryList();

      // 4. 渲染总统计概览
      const totalRevenue = appData.sales.reduce((sum, s) => sum + s.totalRevenue, 0);
      const totalCost = appData.sales.reduce((sum, s) => sum + (s.costPrice * s.quantity), 0);
      const totalProfit = appData.sales.reduce((sum, s) => sum + s.profit, 0);
      document.getElementById('totalRevenue').innerText = '¥' + totalRevenue.toFixed(2);
      document.getElementById('totalCost').innerText = '¥' + totalCost.toFixed(2);
      document.getElementById('totalProfit').innerText = '¥' + totalProfit.toFixed(2);

      const productStats = {};
      appData.sales.forEach(s => {
        if (!productStats[s.productName]) {
          productStats[s.productName] = { qty: 0, revenue: 0, profit: 0 };
        }
        productStats[s.productName].qty += s.quantity;
        productStats[s.productName].revenue += s.totalRevenue;
        productStats[s.productName].profit += s.profit;
      });
      const container = document.getElementById('productStats');
      if (!Object.keys(productStats).length) {
        container.innerHTML = '<div style="color:#5f6b7a;">暂无数据</div>';
        return;
      }
      container.innerHTML = Object.entries(productStats).map(([name, s]) => `
        <div class="product-item">
          <div class="product-info"><strong>${name}</strong><div>销量 ${s.qty} | 销售额 ¥${s.revenue.toFixed(2)}</div></div>
          <div style="font-weight:bold;color:#0a2540;">利润 ¥${s.profit.toFixed(2)}</div>
        </div>
      `).join('');
    }

    // 保存历史每日小结
    function updateDailySummary(today, revenue, cost, profit) {
      let summaries = JSON.parse(localStorage.getItem(DAILY_SUMMARY_KEY) || '[]');
      const existingIndex = summaries.findIndex(item => item.date === today);
      
      const newRecord = { date: today, revenue, cost, profit };
      if (existingIndex !== -1) {
        summaries[existingIndex] = newRecord; // 更新当日记录
      } else {
        summaries.push(newRecord); // 新增当日记录
      }
      localStorage.setItem(DAILY_SUMMARY_KEY, JSON.stringify(summaries));
    }

    // 渲染历史每日小结列表
    function renderDailySummaryList() {
      const container = document.getElementById('dailySummaryList');
      let summaries = JSON.parse(localStorage.getItem(DAILY_SUMMARY_KEY) || '[]');
      
      if (summaries.length === 0) {
        container.innerHTML = '<div style="color:#5f6b7a; text-align:center; padding:10px;">暂无每日小结数据</div>';
        return;
      }

      // 按照时间倒序排列（最新在前）
      summaries.sort((a, b) => b.date.localeCompare(a.date));

      container.innerHTML = summaries.map(s => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding: 8px 0; border-bottom: 1px solid #edf2f8; font-size:14px;">
          <div style="font-weight:500;">${s.date}</div>
          <div style="display:flex; gap:12px; color:#1e2b3c;">
            <span>销: ¥${s.revenue.toFixed(2)}</span>
            <span style="color:#5f6b7a;">成: ¥${s.cost.toFixed(2)}</span>
            <span style="color:#0a2540; font-weight:bold;">利: ¥${s.profit.toFixed(2)}</span>
          </div>
        </div>
      `).join('');
    }

    // 数据备份
    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sales_backup_' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importDataPrompt() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.products && data.sales) {
              if (confirm('导入将覆盖当前数据，确定继续吗？')) {
                appData = data;
                saveData(appData);
                // 导入主数据后，自动重置每日小结（以防数据错乱）
                localStorage.removeItem(DAILY_SUMMARY_KEY);
                renderAll();
                alert('数据导入成功！请刷新查看统计页面重建日结。');
              }
            } else {
              alert('文件格式不正确');
            }
          } catch (ex) { alert('解析失败'); }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function clearAllData() {
      if (confirm('⚠️ 确定清空所有货品和销售记录？此操作不可恢复，建议先导出备份。')) {
        appData = { products: [], sales: [] };
        saveData(appData);
        localStorage.removeItem(DAILY_SUMMARY_KEY); // 一并清空历史日结
        renderAll();
      }
    }

    // 初始渲染
    renderAll();
  </script>
</body>
</html>
